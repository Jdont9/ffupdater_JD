name: "CodeQL"

on:
  push:
    branches: [ "master" ]
    paths:
      - 'ffupdater/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'ffupdater/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/codeql.yml'
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The repository only contains Kotlin/Java (Android app) and a small Python helper script.
        # There is no JavaScript code, so it is not analyzed (CodeQL fails when it finds nothing to analyze).
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # CodeQL Action v3 is deprecated in December 2026, so use v4.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
