name: Android CI

on:
  push:
    branches: [ master ]
    paths:
      - 'ffupdater/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
      - name: Build the release APK (this workflow does not run the tests)
        run: ./gradlew clean assembleRelease
      - name: Install Build Tools 29.0.3 (needed by the APK signing step below)
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ffupdater/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Rename output APK to JDupdater-release.apk
        id: rename
        run: |
          mkdir -p renamed
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" renamed/JDupdater-release.apk
          echo "release_apk=renamed/JDupdater-release.apk" >> "$GITHUB_OUTPUT"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: JDupdater-release-apk-signed
          path: ${{ steps.rename.outputs.release_apk }}
          if-no-files-found: error
      - name: Create GitHub Release (only when pushing a version tag, e.g. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.release_apk }}
          generate_release_notes: true
