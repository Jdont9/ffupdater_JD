name: Android CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
      - name: Build the app (skip unit tests so a flaky/outdated release-age test doesn't block the APK)
        run: ./gradlew clean assembleDebug assembleRelease
      - name: Install Build Tools 29.0.3 (needed by the APK signing step below)
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ffupdater/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Upload built debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffupdater-debug-apk
          path: ffupdater/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ffupdater-release-apk-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
