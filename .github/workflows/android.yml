name: Android CI

on:
  push:
    branches: [ master ]
    paths:
      - 'ffupdater/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # SHA-256 fingerprint of the signing certificate. It must be the same as FFUpdater.signatureHash
      # (and dev/signatures/apk_signature.txt), otherwise JDupdater could not update itself anymore.
      EXPECTED_CERT_SHA256: 27c12c604f2b778b8fb2f1e6aefa81f1625a80d87a0fd553c3375e541e5804c3
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
      - name: Build the release APK (this workflow does not run the tests)
        run: ./gradlew clean assembleRelease
      - name: Sign the release APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # use the newest build tools that are preinstalled on the runner
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build tools: $BUILD_TOOLS"
          UNSIGNED="$(ls ffupdater/build/outputs/apk/release/*-release-unsigned.apk)"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          OUTPUT="renamed/JDupdater-release.apk"
          mkdir -p renamed
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          # the APK must be aligned before it is signed
          "$BUILD_TOOLS/zipalign" -c 4 "$UNSIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$OUTPUT" \
            "$UNSIGNED"
          rm -f "$KEYSTORE"

          # verify the signature and make sure that the expected key was used
          # (stderr is dropped: v1 signatures never cover the files in META-INF, which causes hundreds of warnings)
          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$OUTPUT" 2>/dev/null)"
          echo "$CERTS"
          if ! echo "$CERTS" | grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256"; then
            echo "::error::The APK is not signed with the expected certificate ($EXPECTED_CERT_SHA256)"
            exit 1
          fi
          echo "release_apk=$OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: JDupdater-release-apk-signed
          path: ${{ steps.sign.outputs.release_apk }}
          if-no-files-found: error
      - name: Create GitHub Release (only when pushing a version tag, e.g. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.sign.outputs.release_apk }}
          generate_release_notes: true
